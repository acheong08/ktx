# Weekly PRs for dependency updates, including Caddy (caddy/go.mod).
# Merge, then publish a release to deploy.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /caddy
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
