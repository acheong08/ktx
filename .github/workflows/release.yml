# Builds brain-server and Caddy for Linux when a release is published and
# attaches them to the release. Servers pick it up with ktx-update.
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            caddy/go.sum

      - name: Test
        run: |
          go test ./...
          (cd caddy && go test ./...)

      - name: Build
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            out="$PWD/dist/$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$out/brain-server" ./cmd/brain-server
            (cd caddy && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "$out/caddy" ./cmd/caddy)
            tar -C "$out" -czf "dist/ktx_${TAG}_linux_${arch}.tar.gz" brain-server caddy
          done
          (cd dist && sha256sum ktx_*.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/ktx_*.tar.gz dist/SHA256SUMS --clobber
