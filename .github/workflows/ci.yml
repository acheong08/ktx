name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            caddy/go.sum

      - name: Generated templ code is up to date
        run: |
          go tool templ generate -path internal/web
          git diff --exit-code

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
          (cd caddy && go vet ./... && go test ./...)

      - name: Updater script
        run: bash -n deploy/ktx-update/ktx-update
